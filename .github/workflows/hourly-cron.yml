name: Hourly sentiment pipeline

on:
  schedule:
    # Every hour at minute 0 (UTC). Note: GitHub may delay by a few minutes.
    - cron: '0 * * * *'
  workflow_dispatch: {} # allows manual "Run workflow" button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PiggyTech scrape (PiggyVest / Pocket / PVB)
        run: |
          set -e
          resp=$(curl -sS -w '\n%{http_code}' --max-time 300 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://piggytech-sentiment.vercel.app/api/cron?target=piggytech")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          [ "$code" = "200" ] || exit 1

      - name: Competitor scrape (comparison sections)
        if: always() # run even if the first scrape failed
        run: |
          set -e
          resp=$(curl -sS -w '\n%{http_code}' --max-time 300 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://piggytech-sentiment.vercel.app/api/cron?target=external")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          [ "$code" = "200" ] || exit 1
